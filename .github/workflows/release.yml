name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name (e.g. v0.1.0-pre.6). Required for manual runs."
        required: true

jobs:
  build:
    name: build windows-x86_64
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install WinFsp
        shell: pwsh
        run: |
          $url = "https://github.com/winfsp/winfsp/releases/download/v2.0/winfsp-2.0.23075.msi"
          $msi = "$env:RUNNER_TEMP\winfsp.msi"
          Invoke-WebRequest -Uri $url -OutFile $msi
          Start-Process msiexec.exe -Wait -ArgumentList "/i `"$msi`" /qn /norestart"

      - name: Build release binaries (without WinFsp-dependent crates)
        run: cargo build --release --workspace

      - name: Build mount binary (requires WinFsp)
        run: cargo build --release -p applesauce-mount --features winfsp-bridge/mount
        continue-on-error: true

      - name: Resolve tag name
        id: tag
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF -like "refs/tags/*") {
            $env:GITHUB_REF -replace "^refs/tags/", ""
          } else {
            "${{ github.event.inputs.tag }}"
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Stage artifacts
        shell: pwsh
        run: |
          $stage = "stage"
          New-Item -ItemType Directory -Force $stage | Out-Null
          $bins = @(
            "applesauce-cat.exe",
            "applesauce-parts.exe",
            "applesauce-gui.exe",
            "applesauce-mount.exe"
          )
          foreach ($b in $bins) {
            $src = "target\release\$b"
            if (Test-Path $src) { Copy-Item $src $stage }
          }
          Copy-Item README.md, CHANGELOG.md, LICENSE-MIT, LICENSE-APACHE $stage
          $zip = "applesauce-${{ steps.tag.outputs.tag }}-x86_64-pc-windows-msvc.zip"
          Compress-Archive -Path "$stage\*" -DestinationPath $zip
          "zip=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          draft: true
          generate_release_notes: true
          body_path: CHANGELOG.md
          files: ${{ env.zip }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
