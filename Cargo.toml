[workspace]
resolver = "2"
members = [
    "crates/block-source",
    "crates/fs-core",
    "crates/winfsp-bridge",
    "apps/applesauce-cat",
    "apps/applesauce-gui",
    "apps/applesauce-mount",
    "apps/applesauce-parts",
]
# Only applesauce-mount needs WinFsp + LLVM at build time. The GUI
# shells out to the WinFsp.Launcher service via `launchctl-x64.exe`,
# so it builds without WinFsp deps. `cargo build` from root covers
# everything except the mount binary; build that with `cargo build -p
# applesauce-mount` after installing WinFsp + LLVM.
default-members = [
    "crates/block-source",
    "crates/fs-core",
    "crates/winfsp-bridge",
    "apps/applesauce-cat",
    "apps/applesauce-gui",
    "apps/applesauce-parts",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zombodotcom/applesauce"
rust-version = "1.94"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
binrw = "0.14"
byteorder = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
