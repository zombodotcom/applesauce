[workspace]
resolver = "2"
members = [
    "crates/block-source",
    "crates/fs-core",
    "crates/winfsp-bridge",
    "apps/applesauce-cat",
    "apps/applesauce-gui",
    "apps/applesauce-mount",
    "apps/applesauce-parts",
]
# `cargo build` / `cargo check` from the root skips applesauce-mount, so
# the workspace builds without WinFsp installed. Build the mount binary
# explicitly with `cargo build -p applesauce-mount`.
default-members = [
    "crates/block-source",
    "crates/fs-core",
    "crates/winfsp-bridge",
    "apps/applesauce-cat",
    "apps/applesauce-gui",
    "apps/applesauce-parts",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zombodotcom/applesauce"
rust-version = "1.94"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
binrw = "0.14"
byteorder = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
