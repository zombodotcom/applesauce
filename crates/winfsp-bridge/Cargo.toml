[package]
name = "winfsp-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "WinFsp glue that mounts an fs-core MacFilesystem as a Windows drive letter"

[features]
# Default is off so `cargo build --workspace` works without WinFsp
# installed. Enable `mount` to pull in the winfsp + windows crates
# (requires WinFsp from https://winfsp.dev/ at build time).
default = []
mount = ["dep:winfsp", "dep:windows"]

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
fs-core = { path = "../fs-core" }

[target.'cfg(windows)'.dependencies]
winfsp = { version = "0.12", optional = true }
windows = { version = "0.58", optional = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }
